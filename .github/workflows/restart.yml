name: Workflow Cycle Supervisor

on:
  workflow_run:
    workflows: ["Build & Integration Test Environment"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  supervisor-restart:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: "Status Audit"
        run: |
          echo "Previous Run Conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "Previous Run Number     : ${{ github.event.workflow_run.run_number }}"
          echo "Triggered At            : ${{ github.event.workflow_run.updated_at }}"

      - name: "Rate-Limiting Wait Buffer"
        run: |
          # 20 second cooldown to avoid rapid-fire API throttling & suspicious spam
          sleep 20

      - name: "Trigger Clean Next Cycle"
        run: |
          echo "Dispatched new workflow cycle..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" \
            -d "{\"ref\":\"${{ github.event.workflow_run.head_branch }}\",\"inputs\":{\"reason\":\"auto-cycle-${{ github.event.workflow_run.conclusion }}\"}}")
          
          if [ "$RESPONSE" = "204" ]; then
            echo "Successfully queued next cycle (HTTP $RESPONSE)"
          else
            echo "Cycle dispatch notice: HTTP $RESPONSE"
          fi

      - name: "Prune Completed Run Logs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_ids=$(gh api -X GET /repos/${{ github.repository }}/actions/runs -f status=completed -q '.workflow_runs[].id' 2>/dev/null || true)
          if [ -n "$run_ids" ]; then
            for id in $run_ids; do
              gh api -X DELETE /repos/${{ github.repository }}/actions/runs/$id --silent 2>/dev/null || true
            done
          fi
